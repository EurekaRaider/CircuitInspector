appId: com.circuitinspector.viewer
productName: CircuitInspector
directories:
  app: apps/viewer
  output: release
  buildResources: apps/viewer/assets
files:
  - dist/**
  - assets/icon.png
  - package.json
extraResources:
  - from: target/release/${env.CIRCUIT_INSPECTOR_CORE_BINARY}
    to: bin/${env.CIRCUIT_INSPECTOR_CORE_BINARY}
  - from: apps/viewer/dist/ocr-worker.cjs
    to: ocr/ocr-worker.cjs
  - from: node_modules/tesseract.js-core
    to: ocr/tesseract.js-core
  - from: node_modules/@tesseract.js-data/eng/4.0.0_best_int
    to: ocr/lang
  - from: node_modules/pdfjs-dist/standard_fonts
    to: pdfjs/standard_fonts
  - from: node_modules/pdfjs-dist/cmaps
    to: pdfjs/cmaps
  - from: node_modules/pdfjs-dist/wasm
    to: pdfjs/wasm
asar: true
asarUnpack:
  - node_modules/@napi-rs/**/*.node
npmRebuild: false
mac:
  target:
    - dmg
    - zip
  category: public.app-category.developer-tools
  artifactName: CircuitInspector-macOS-${arch}-${version}.${ext}
  icon: icon.icns
  identity: null
win:
  target: zip
  artifactName: CircuitInspector-Windows-${arch}-${version}.${ext}
  icon: icon.ico
publish: null
protocols:
  - name: CircuitInspector analysis link
    schemes:
      - circuitinspector
